<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeStud Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container" id="loginContainer">

        <div class="illustration-panel">
            <div class="art-wrapper" id="artWrapper">

                <!-- Boneco Roxo — sem mãos -->
                <div class="shape-purple" id="shapePurple">
                    <div class="eye eye-left" id="purpleEyeLeft">
                        <div class="pupil"></div>
                    </div>
                    <div class="mouth"></div>
                    <div class="eye eye-right" id="purpleEyeRight">
                        <div class="pupil"></div>
                    </div>
                </div>

                <!-- Boneco Preto -->
                <div class="shape-black" id="shapeBlack">
                    <div class="eye eye-left" id="blackEyeLeft">
                        <div class="pupil"></div>
                    </div>
                    <div class="eye eye-right" id="blackEyeRight">
                        <div class="pupil"></div>
                    </div>
                </div>

                <!-- Boneco Amarelo -->
                <div class="shape-yellow" id="shapeYellow">
                    <div class="eye" id="yellowEye">
                        <div class="pupil"></div>
                    </div>
                    <div class="mouth" id="yellowMouth"></div>
                </div>

                <!-- Boneco Laranja -->
                <div class="shape-orange" id="shapeOrange">
                    <div class="eye eye-left" id="orangeEyeLeft">
                        <div class="pupil"></div>
                    </div>
                    <div class="mouth" id="orangeMouth"></div>
                    <div class="eye eye-right" id="orangeEyeRight">
                        <div class="pupil"></div>
                    </div>
                </div>

            </div>
        </div>

        <div class="form-panel">
            <div class="logo">
                <span class="logo-icon"></span>
            </div>

            <div class="header">
                <h1>Welcome back!</h1>
                <p>Please enter your details</p>
            </div>

            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="email" id="email" placeholder=" " autocomplete="email" required>
                    <label for="email">Email</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
                    <label for="password">Password</label>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>

                <div class="options">
                    <label class="checkbox-container">
                        <input type="checkbox"> Remember for 30 days
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="btnLogin">Log In</button>

                <button type="button" class="btn btn-google">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Log in with Google
                </button>
            </form>

            <div class="signup-text">
                Don't have an account? <a href="#">Sign Up</a>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
